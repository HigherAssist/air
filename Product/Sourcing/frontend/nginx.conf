server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Allow embedding in iframes from AIR app domains
    add_header X-Frame-Options "ALLOW-FROM https://dev.d3carnh06cjb9r.amplifyapp.com https://stage.d3carnh06cjb9r.amplifyapp.com";
    add_header Content-Security-Policy "frame-ancestors 'self' https://*.amplifyapp.com https://*.hireassist.net http://localhost:5173";

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
